<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" font-family="system-ui,sans-serif">
<rect width="880" height="288" fill="#fcfcfb"/>
<style>.t{font-size:14.5px;font-weight:600;fill:#0b0b0b}.a{font-size:11px;fill:#52514e}.g{font-size:10px;fill:#52514e}.m{font-size:11px;font-family:ui-monospace,monospace;fill:#0b0b0b}.mg{font-size:10px;font-family:ui-monospace,monospace;fill:#52514e}</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#52514e"/></marker><marker id="ahb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#2a78d6"/></marker></defs>
<rect x="60" y="96" width="170" height="40" fill="none" stroke="#52514e" stroke-width="1" rx="3"/>
<text x="145" y="116" class="a" text-anchor="middle">peek one byte</text>
<text x="145" y="130" class="g" text-anchor="middle">(no bounds re-check)</text>
<rect x="420" y="44" width="210" height="36" fill="none" stroke="#52514e" stroke-width="1" rx="3"/>
<text x="525" y="66" class="m" text-anchor="middle">field 1: name</text>
<path d="M 230 116 C 320 116, 330 62, 416 62" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="330" y="56" class="mg" text-anchor="middle">0x0a</text>
<rect x="420" y="104" width="210" height="36" fill="none" stroke="#52514e" stroke-width="1" rx="3"/>
<text x="525" y="126" class="m" text-anchor="middle">field 2: id</text>
<path d="M 230 116 C 320 116, 330 122, 416 122" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="330" y="116" class="mg" text-anchor="middle">0x10</text>
<rect x="420" y="164" width="210" height="36" fill="none" stroke="#52514e" stroke-width="1" rx="3"/>
<text x="525" y="186" class="m" text-anchor="middle">field 3: tags</text>
<path d="M 230 116 C 320 116, 330 182, 416 182" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="330" y="176" class="mg" text-anchor="middle">0x1a</text>
<rect x="420" y="228" width="300" height="36" fill="none" stroke="#52514e" stroke-width="1" rx="3" stroke-dasharray="4 3"/>
<text x="570" y="250" class="a" text-anchor="middle">general fused tag read (step 4)</text>
<path d="M 145 136 C 145 246, 260 246, 416 246" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="240" y="234" class="g" text-anchor="start">anything else: higher fields,</text>
<text x="240" y="268" class="g" text-anchor="start">unknown, non-minimal</text>
<text x="660" y="62" class="g" text-anchor="start">each tag byte jumps straight</text>
<text x="660" y="76" class="g" text-anchor="start">to that field&#8217;s label</text>
</svg>