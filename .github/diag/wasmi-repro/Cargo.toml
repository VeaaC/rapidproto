# TEMPORARY: a minimal wasmi + wasmi_wasi host for the Windows x86_64 crash, with none of
# RapidProto's code. The default feature set is rapidproto-build's.
[package]
name = "wasmi-repro"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["portable"]
portable = ["wasmi/portable-dispatch"]
auto = ["wasmi/auto-dispatch"]
tail = []

[dependencies]
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "memory64"] }
wasmi_wasi = "=2.0.0"

[workspace]
