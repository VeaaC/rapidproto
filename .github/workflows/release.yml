# Release: on a version tag, verify the tagged commit is on main -- the branch where every push runs
# ci.yml's full matrix (corpus sweep, arm64, sanitizers, tidy shards, consumer); tags alone don't
# trigger ci.yml, so this check is what stops a tag on an unvetted commit from shipping. Ancestry
# proves the commit went through main, not that its matrix run finished green (a push superseded
# quickly enough gets its run cancelled, and stays an ancestor) -- confirming the run is on whoever
# tags. Then re-run the gate against the commit, build an optimized rapidprotoc per architecture,
# and publish ONE GitHub Release carrying every binary (the source archive is GitHub's own).
#
# Split into a build matrix + a publish job: the architectures live once, in the matrix list, and
# publish waits on all of them -- so a failed build leg blocks the whole release instead of
# publishing without its binary (two independent `gh release create` calls would race, and the
# loser's upload could be lost with the release already public).
name: Release

on:
  push:
    tags: ['v*']

# Least privilege: only publish creates the release; the build legs run the whole gate (fuzz
# harnesses, downloaded toolchain) and must not hold a write token they never use.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      # Both legs' verdicts in one run: a release tag is expensive to re-cut, and nothing ships
      # on failure anyway, so letting the second leg finish costs nothing and saves a re-tag
      # cycle when both would have failed.
      fail-fast: false
      matrix:
        include:
          # gate: the check.sh invocation mode verifying the tag on this runner. x86_64 runs the
          # full default set (empty = no argument); arm64 runs only the architecture-sensitive
          # subset -- `compilers` is check.sh's name for it, the same mode ci.yml's arm64 job
          # runs, so the stage list lives once in check.sh. The rest of the default gate is
          # architecture-independent and runs on the x86_64 leg.
          - arch: x86_64
            runner: ubuntu-24.04
            gate: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            gate: 'compilers'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the ancestor check below needs main's history, not a depth-1 tag
      - name: Require the tagged commit to be on main (ci.yml's matrix gated it there)
        # HEAD, not GITHUB_SHA: on an annotated-tag push the latter can name the TAG OBJECT;
        # checkout has already peeled HEAD to the commit, so HEAD sidesteps the quirk entirely.
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::tag ${GITHUB_REF_NAME} points at $(git rev-parse HEAD), which is not on"
            echo "::error::main -- no full CI matrix has gated it; merge it via a PR first."
            exit 1
          }
      - uses: ./.github/actions/setup-toolchain
      - name: Quality gate (./check.sh ${{ matrix.gate }})
        # An empty gate renders to a bare `./check.sh` (word-split drops the empty argument),
        # which is the full default set.
        run: ./check.sh ${{ matrix.gate }}
      - name: Build the release binary
        run: |
          set -euxo pipefail
          # WERROR off: this build runs on the un-pinned runner compiler, and a new compiler's
          # warnings must not block a release the pinned-toolchain gate above already passed.
          cmake -S . -B build/rel -DCMAKE_BUILD_TYPE=Release -DRAPIDPROTO_BUILD_TESTS=OFF \
            -DRAPIDPROTO_WERROR=OFF
          cmake --build build/rel -j"$(nproc)"
          # A mis-tagged push must not ship a binary whose --version contradicts its tag.
          test "$(./build/rel/rapidprotoc --version)" = "rapidprotoc ${GITHUB_REF_NAME#v}"
          # Apache-2.0: the NOTICE and attributions travel with the redistributed binary.
          tar -czf "rapidprotoc-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz" \
            -C build/rel rapidprotoc -C "$GITHUB_WORKSPACE" LICENSE NOTICE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: rapidprotoc-${{ matrix.arch }}
          path: rapidprotoc-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build  # every matrix leg -- a failed build is a failed release, not a thinner one
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rapidprotoc-*
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" rapidprotoc-*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed."
