# Release: on a version tag, verify the tagged commit is on main -- the branch where every push runs
# ci.yml's full matrix (corpus sweep, arm64, macos, sanitizers, tidy shards, consumer); tags don't
# trigger ci.yml, so this check is what stops a tag on an unvetted commit from shipping. Ancestry
# proves the commit went through main, not that its matrix run finished green (a push superseded
# quickly enough gets its run cancelled, and stays an ancestor) -- confirming the run is on whoever
# tags. Then re-run the gate against the commit, build an optimized rapidprotoc per
# platform/architecture, and publish ONE GitHub Release carrying every binary (the source
# archive is GitHub's own).
#
# Split into a build matrix + a publish job: the platform/arch legs live once, in the matrix, and
# publish waits on all of them -- so a failed build leg blocks the whole release instead of
# publishing without its binary (two independent `gh release create` calls would race, and the
# loser's upload could be lost with the release already public).
name: Release

on:
  push:
    tags: ['v*']

# Least privilege: only publish creates the release; the build legs run the whole gate (fuzz
# harnesses, downloaded toolchain) and must not hold a write token they never use.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    strategy:
      # Every leg's verdict in one run: a release tag is expensive to re-cut, and nothing ships
      # on failure anyway, so letting the other legs finish costs nothing and saves a re-tag
      # cycle when several would have failed.
      fail-fast: false
      matrix:
        include:
          # verify: the command that verifies the tag on this runner. linux-x86_64 runs the full
          # default gate (a bare ./check.sh); linux-arm64 the architecture-sensitive subset --
          # `compilers` is check.sh's name for it, the same mode ci.yml's arm64 job runs, so that
          # stage list lives once in check.sh; macos runs tests/system_build_test.sh, the one
          # home for the system-compiler sequence shared with ci.yml's macos job (check.sh needs
          # bash >= 4.4 and pinned compilers; macOS runners have neither). windows carries no
          # `verify` value: bash-only check.sh can't run there, so its own steps below
          # configure/build/test with the MSVC generator (mirroring ci.yml's windows job) before
          # packaging. Everything architecture- and platform-independent (format, tidy, docs, ...)
          # runs on the linux-x86_64 leg.
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            verify: './check.sh'
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            verify: './check.sh compilers'
          - os: macos
            arch: arm64
            runner: macos-15
            verify: 'tests/system_build_test.sh'
          - os: windows
            arch: x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the ancestor check below needs main's history, not a depth-1 tag
      - name: Require the tagged commit to be on main (ci.yml's matrix gated it there)
        # HEAD, not GITHUB_SHA: on an annotated-tag push the latter can name the TAG OBJECT;
        # checkout has already peeled HEAD to the commit, so HEAD sidesteps the quirk entirely.
        shell: bash  # Git Bash on the windows runner; the default shell everywhere else
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::tag ${GITHUB_REF_NAME} points at $(git rev-parse HEAD), which is not on"
            echo "::error::main -- no full CI matrix has gated it; merge it via a PR first."
            exit 1
          }
      - uses: ./.github/actions/setup-toolchain
        # apt-based; the macos leg's verify script needs only the image's cmake + AppleClang, and
        # the windows leg only the image's MSVC + cmake.
        if: runner.os == 'Linux'
      # --- Unix legs (bash, tarball) ---
      - name: Verify the tag (${{ matrix.verify }})
        # The expression is substituted into the script TEXT before the shell runs -- which also
        # means a verify value with shell metacharacters would be injected verbatim. All values
        # are literals in this file; keep them that way.
        if: runner.os != 'Windows'
        run: ${{ matrix.verify }}
      - name: Build the release binary
        if: runner.os != 'Windows'
        run: |
          set -euxo pipefail
          # WERROR off: this build runs on the un-pinned runner compiler, and a new compiler's
          # warnings must not block a release the verification above already passed.
          cmake -S . -B build/rel -DCMAKE_BUILD_TYPE=Release -DRAPIDPROTO_BUILD_TESTS=OFF \
            -DRAPIDPROTO_WERROR=OFF
          # getconf, not nproc: this step runs on macOS too, which has no nproc.
          cmake --build build/rel -j"$(getconf _NPROCESSORS_ONLN)"
          # A mis-tagged push must not ship a binary whose --version contradicts its tag.
          test "$(./build/rel/rapidprotoc --version)" = "rapidprotoc ${GITHUB_REF_NAME#v}"
          # Apache-2.0: the NOTICE and attributions travel with the redistributed binary.
          # COPYFILE_DISABLE: macOS bsdtar otherwise embeds AppleDouble ._ metadata entries
          # (com.apple.provenance from the --version run above), breaking the same-layout-
          # everywhere property. A no-op on Linux.
          COPYFILE_DISABLE=1 \
          tar -czf "rapidprotoc-${GITHUB_REF_NAME}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            -C build/rel rapidprotoc -C "$GITHUB_WORKSPACE" LICENSE NOTICE THIRD_PARTY_NOTICES.md
      # --- Windows leg (MSVC generator, .zip) --- check.sh is bash-only, so this leg verifies with
      # the Visual Studio generator as ci.yml's windows job does, then builds the optimized exe and
      # packages a .zip (the Windows-native archive) instead of a tarball.
      - name: Verify the tag (MSVC configure + build + test)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DRAPIDPROTO_WERROR=OFF
          cmake --build build/ci --config Release -j
          ctest --test-dir build/ci -C Release --output-on-failure
      - name: Build the release binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/rel -G "Visual Studio 17 2022" -A x64 \
            -DRAPIDPROTO_BUILD_TESTS=OFF -DRAPIDPROTO_WERROR=OFF
          cmake --build build/rel --config Release -j
          # A mis-tagged push must not ship a binary whose --version contradicts its tag.
          # --version prints the invoked basename, which on Windows keeps the .exe suffix
          # (path::filename), so the expected string carries it too. tr -d '\r': the exe's stdout
          # is CRLF on Windows; strip it before the compare.
          ver="$(./build/rel/Release/rapidprotoc.exe --version | tr -d '\r')"
          test "$ver" = "rapidprotoc.exe ${GITHUB_REF_NAME#v}"
          # Flat staging dir so the .zip stores the exe and the Apache-2.0 files at its root -- the
          # same layout as the Unix tarballs. 7z ships on the windows runner image.
          mkdir stage
          cp build/rel/Release/rapidprotoc.exe LICENSE NOTICE THIRD_PARTY_NOTICES.md stage/
          (cd stage && 7z a "../rapidprotoc-${GITHUB_REF_NAME}-${{ matrix.os }}-${{ matrix.arch }}.zip" ./*)
      - uses: actions/upload-artifact@v4
        with:
          # os AND arch: linux-arm64 and macos-arm64 must not collide on one artifact name.
          name: rapidprotoc-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            rapidprotoc-*.tar.gz
            rapidprotoc-*.zip
          if-no-files-found: error

  publish:
    needs: build  # every matrix leg -- a failed build is a failed release, not a thinner one
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rapidprotoc-*
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" rapidprotoc-*.tar.gz rapidprotoc-*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed."
