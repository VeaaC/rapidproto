# Rust support CI — runs only on the `rust` feature branch and PRs targeting it, so `main`'s C++
# gate is untouched. Kept light for the public 4-core runners: fmt, clippy, test, and a
# no_std-no-alloc build, plus the wasm-blob staleness gate, Miri (arena provenance/borrows), and a
# libFuzzer+ASan smoke over the arena decoder.
name: Rust CI

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      # std+alloc covers the whole workspace, including rapidproto-build (the wasmi generator driver
      # and its golden dogfooding gate), consumer-example (whose build.rs runs the blob end to end),
      # and rapidproto-diff (the differential Serializer). rapidproto-bench is linted and tested
      # SEPARATELY (below) at its DEFAULT features, NOT via the blanket `--all-features` runs: its
      # off-by-default `google-upb` arm pulls Google's upb `protobuf` crate, which needs an exact-version
      # protoc + a C toolchain this runner lacks, so `--all-features` would fail to build it. The
      # no_std/no-alloc tiers exercise the `rapidproto` runtime crate's embedded tiers, so they --exclude
      # all of these: each is a std-only build tool / demo / bench, meaningless under no_std and costly
      # to recompile per tier on the 4-core runners.
      - name: Clippy (std + alloc)
        run: cargo clippy --workspace --exclude rapidproto-bench --all-targets --all-features -- -D warnings
      - name: Clippy (rapidproto-bench, default features)
        run: cargo clippy -p rapidproto-bench --all-targets -- -D warnings
      - name: Clippy (no_std + alloc)
        run: cargo clippy --workspace --exclude rapidproto-build --exclude consumer-example --exclude rapidproto-diff --exclude rapidproto-bench --all-targets --no-default-features --features alloc -- -D warnings
      - name: Clippy (no_std, no-alloc)
        run: cargo clippy --workspace --exclude rapidproto-build --exclude consumer-example --exclude rapidproto-diff --exclude rapidproto-bench --all-targets --no-default-features -- -D warnings
      - name: Test (std + alloc)
        run: cargo test --workspace --exclude rapidproto-bench --all-features
      # rapidproto-bench's quick-protobuf arm decodes `Big.reals` (repeated double) by borrowing the
      # input as an unaligned `&[f64]` -- UB that the debug build's alignment check aborts on. Its
      # `bigset` agreement test is therefore release-only (`#[cfg(not(debug_assertions))]`) and the
      # bench binary drops that arm from the packed-double scenarios in debug, so the step above never
      # runs it; this release step exercises it (the UB-check is compiled out, correct on this x86 host).
      - name: Test the ecosystem bench in release (exercises the release-only quick-protobuf arm)
        run: cargo test -p rapidproto-bench --release
      - name: Run the consumer example (build.rs -> blob -> decode, cargo only)
        run: cargo run -p consumer-example
      - name: Test (no_std + alloc)
        run: cargo test --workspace --exclude rapidproto-build --exclude consumer-example --exclude rapidproto-diff --exclude rapidproto-bench --no-default-features --features alloc
      - name: Test (no_std, no-alloc)
        # The test harness keeps std (crate is no_std only outside tests), while the `alloc`
        # feature is off — so this exercises the arena's no-allocator / exhaustion path.
        run: cargo test --workspace --exclude rapidproto-build --exclude consumer-example --exclude rapidproto-diff --exclude rapidproto-bench --no-default-features
      - name: Build no_std + alloc tier
        run: cargo build --workspace --exclude rapidproto-build --exclude consumer-example --exclude rapidproto-diff --exclude rapidproto-bench --no-default-features --features alloc
      - name: Build no_std (no-alloc embedded tier)
        run: cargo build --workspace --exclude rapidproto-build --exclude consumer-example --exclude rapidproto-diff --exclude rapidproto-bench --no-default-features
      # The generated serde Serialize impls must also stay no_std-clean (alloc and no-alloc), since a
      # consumer may enable rapidproto/serde on an embedded target. (--all-features above covers std.)
      - name: Build generated serde impls on the no_std tiers
        run: |
          cargo build -p rustgen-golden --no-default-features --features alloc,serde
          cargo build -p rustgen-golden --no-default-features --features serde

  wasm-blob:
    # The rapidproto-build crate ships a committed wasm blob (the Rust generator front-end) so
    # consumers need no C++ toolchain. This gate rebuilds it from source with the pinned wasi-sdk and
    # byte-diffs it against the committed copy: a difference means the C++ generator changed without
    # the blob being regenerated. The build is byte-reproducible, so the diff is exact.
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "34.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install wasi-sdk
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          major="${WASI_SDK_VERSION%%.*}"
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${major}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o /tmp/wasi-sdk.tar.gz
          sudo mkdir -p /opt/wasi-sdk
          sudo tar xf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
      - name: Blob is in sync with the C++ generator
        working-directory: ${{ github.workspace }}
        run: rust/rapidproto-build/wasm/check-wasm.sh

  fuzz:
    # Never-crash / no-UB gate for the arena decoder: a libFuzzer + AddressSanitizer harness
    # (rust/rustgen-golden/fuzz) that drives arbitrary bytes through five generated decoders whose
    # arms differ most, mirroring the C++ tests/fuzz/fuzz_arena.cpp. cargo-fuzz needs nightly.
    # `fuzz build` is the always-on compile gate (catches harness / generated-code bitrot); the short
    # seeded run then actually exercises the decoders -- a crash saves the input and fails the job.
    # The C++ keeps its long multi-sanitizer fuzz in the opt-in deep tier; a single ASan target for
    # 30s is the CI-affordable mirror here (raise -max_total_time for a deeper local run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Pin the gnu host target. cargo-fuzz defaults --target to the triple IT was built for, and the
      # prebuilt binary install-action fetches is musl-static -- so without this it builds for
      # x86_64-unknown-linux-musl, whose std isn't installed here and whose static libc is ASan-
      # incompatible. gnu is the runner's installed host target (dynamic libc), so ASan links cleanly.
      - name: Build the fuzz target (ASan)
        working-directory: rust/rustgen-golden
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu fuzz_arena
      - name: Smoke run over the committed seeds
        working-directory: rust/rustgen-golden
        # First dir is libFuzzer's writable corpus (must exist; gitignored); seeds/ is read-only
        # input, so the committed fixtures are never written back to.
        run: |
          mkdir -p fuzz/corpus/fuzz_arena
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fuzz_arena fuzz/corpus/fuzz_arena fuzz/seeds/fuzz_arena -- -max_total_time=30 -timeout=10

  miri:
    # The arena hands out `&mut` from `&self` and does raw-pointer bumping; Miri checks that
    # against strict provenance and Stacked/Tree Borrows. Runs on both the alloc and no-alloc tiers.
    # rapidproto-build and consumer-example are --exclude'd: both are safe Rust that drive the wasmi
    # interpreter over the blob and do filesystem I/O, which Miri's isolation forbids and has nothing
    # unsafe for Miri to check anyway.
    runs-on: ubuntu-latest
    env:
      # Actively enforce the arena's strict-provenance claim (it uses no int→ptr casts).
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri (std + alloc)
        run: cargo miri test --workspace --exclude rapidproto-build --exclude consumer-example --exclude rapidproto-diff --exclude rapidproto-bench --all-features
      - name: Miri (no_std, no-alloc)
        run: cargo miri test --workspace --exclude rapidproto-build --exclude consumer-example --exclude rapidproto-diff --exclude rapidproto-bench --no-default-features
