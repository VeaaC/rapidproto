# Rust support CI — runs only on the `rust` feature branch and PRs targeting it, so `main`'s C++
# gate is untouched. Kept light for the public 4-core runners: fmt, clippy, test, and a
# no_std-no-alloc build. Miri (arena), the wasm build, and the generated-code-compiles check are
# added as their sub-steps land.
name: Rust CI

on:
  push:
    branches: [rust]
  pull_request:
    branches: [rust]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Build no_std + alloc tier
        run: cargo build --no-default-features --features alloc
      - name: Build no_std (no-alloc embedded tier)
        run: cargo build --no-default-features
