# On-demand benchmark snapshot -- NOT a gate. GitHub-hosted runners are shared, frequency-uncontrolled
# VMs, so the GB/s numbers are a ROUGH sanity signal (are we beating protoc/protozero, did a change
# swing things a lot), not the pinned-P-core measurement tests/bench.py's methodology needs -- treat a
# CI number as +/- tens of percent. Its value is (1) seeing arm64 numbers you have no other way to get,
# and (2) a quick before/after eyeball. "NOT a gate" is about the NUMBERS; correctness still fails the
# job: every scenario cross-checks its arms' decode checksums (against protoc/protozero where they have
# an arm, RapidProto against RapidProto where they don't), both bench mains exit nonzero on a mismatch,
# and this job propagates that -- so a red run flags an arm64 correctness divergence as a bonus.
# Trigger it by hand from the Actions tab; results upload as artifacts (per arch x compiler) and a
# compact summary prints to the log.
name: Benchmark (on-demand)

on:
  workflow_dispatch:

jobs:
  bench:
    name: bench (${{ matrix.arch }} / ${{ matrix.cc }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false  # one arch/compiler failing must not cancel the others' numbers
      matrix:
        include:
          - { arch: x86_64, runs-on: ubuntu-24.04,     cxx: g++-13,     cc: gcc }
          - { arch: x86_64, runs-on: ubuntu-24.04,     cxx: clang++-20, cc: clang }
          - { arch: arm64,  runs-on: ubuntu-24.04-arm, cxx: g++-13,     cc: gcc }
          - { arch: arm64,  runs-on: ubuntu-24.04-arm, cxx: clang++-20, cc: clang }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Configure
        run: cmake -S . -B build/bench -DCMAKE_CXX_COMPILER='${{ matrix.cxx }}'
      - name: Benchmark + summarize (informational)
        run: |
          set -euxo pipefail
          mkdir -p bench-out
          tag='${{ matrix.arch }}-${{ matrix.cc }}'
          out="bench-out/bench.$tag.ndjson"
          # bench.py builds both bench binaries, pins them (taskset -c 0), runs each ONCE
          # (--repeat 1: this snapshot is never diffed, so repeats would only cost wall time), tags
          # every record with its decoder (arena|stream), and merges to one snapshot. A shared runner
          # spins to a steady frequency but still can't be trusted for tight deltas -- read as rough.
          # No `|| true`, no empty-output exit 0: a bench build failure, a crashed binary, or a
          # checksum mismatch (the binaries exit nonzero; bench.py's check_output propagates it)
          # must turn this job red, or the header's correctness claim is a lie.
          # --no-compile on the clang legs: the embedded compile sweep always measures BOTH
          # pinned compilers, so per arch it lands with the gcc leg once rather than twice.
          python3 tests/bench.py run --repeat 1 --build-dir build/bench --core 0 --out "$out" \
            ${{ matrix.cc == 'clang' && '--no-compile' || '' }}
          [ -s "$out" ] || { echo "no benchmark output produced"; exit 1; }
          # bench.py's own renderer, not a hand-rolled summary: the inline script this replaces
          # hardcoded seven scenario labels while varint_dists() emits fifteen -- fx3..fx10 and
          # mix13out were silently absent from every CI summary, with nothing linking the lists.
          echo "=== $tag (informational, noisy CI) ==="
          python3 tests/bench.py table "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.arch }}-${{ matrix.cc }}
          path: bench-out/
          if-no-files-found: ignore
