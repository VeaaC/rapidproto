# Continuous integration: the project's quality bar on every push to the default branch and every
# pull request. Parallel jobs -- the default gate's build/test stages, its clang-tidy stage as a
# three-shard matrix (tidy is 45-55% of the gate's CPU, so it gets its own runners), a corpus job
# that sweeps ~8000 real third-party schemas and compiles a bounded sample of them (its own runner:
# it needs a ~100 MB fetch), an arm64 build/test job (the SWAR decode kernels lower to native
# AArch64 instructions x86 can't exercise), a macos build/test job (AppleClang + libc++), the heavy
# "deep" tier (sanitizers + coverage floor + fuzz smoke; its corpus legs live in the corpus job,
# which has the fetch), a Release -O3 -Werror build on both compilers, and the consumer job
# (install -> find_package -> newer-standard header compiles) -- so wall-clock is the slowest
# runner, not the sum.
name: CI

on:
  push:
    branches: [main]  # feature-branch pushes are gated by their PR run, not double-run
  pull_request:

# A newer push to the same ref cancels an in-progress run, so only the latest commit is gated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `differential` and `names` ride here rather than in their own jobs: both reuse the gcc build
  # this job already makes. `differential` needs only protoc + the protobuf Python bindings, which
  # setup-toolchain installs; `names` is what keeps the CMake helper's output paths in step with
  # the CLI (plus the declared-outputs delete/restore loop and a compiled prefixed TU), and used to
  # run only locally and on release tags -- a PR that broke it went green.
  gate:
    name: gate (format + dual-compiler build/test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Quality gate minus tidy (./check.sh)
        # DERIVED from check.sh's DEFAULT_STAGES via the skip list, not a hand copy of it: a stage
        # added to the default gate is in PR CI the moment it exists (a copied list once left
        # `names` running only locally). tidy has its own sharded runners below.
        run: RAPIDPROTO_GATE_SKIP=tidy ./check.sh

  # The real-world compatibility check (see tests/corpus_gate.py for what it covers and why).
  # Its own job because it needs a ~100 MB fetch the other jobs don't, keeping that off the main
  # gate's critical path. Two known costs, accepted deliberately rather than hidden: the fetch is
  # uncached (if it becomes the slow part, key an actions/cache on the pinned SHAs in
  # tests/fetch_corpus.py), and the 'gcc' stage is here to produce the rapidprotoc the sweep drives
  # -- which re-runs the unit tests and consumer examples the `gate` job already ran. Splitting a
  # build-only stage out of job_build_test would fix that if it ever matters.
  # Expect minutes rather than the ~3 min a 20-core dev box sees: the sweep is ~48 CPU-minutes and
  # the compile sample ~13 more, so a 2-core runner is the constraint.
  corpus:
    name: corpus (real-world schema sweep + compile sample)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Fetch the corpus at its pinned refs
        run: python3 tests/fetch_corpus.py
      - name: Sweep it (./check.sh; gcc builds the rapidprotoc the sweep drives)
        run: RAPIDPROTO_GATE_STAGES='gcc corpus' ./check.sh
      # The deep tier's other corpus leg, run here because this is the job with the fetch: the
      # sweep above GENERATES every schema and compiles none, so this compiles a bounded sample,
      # both models in one TU -- the only shape that can catch a collision between them. In the
      # deep job it self-skips (exit 77, no corpus); duplicating the fetch there would re-run the
      # ~48 CPU-minute sweep for nothing.
      - name: Compile a bounded sample of it (both models in one TU)
        run: python3 tests/corpus_compile.py --rapidprotoc ./build/gcc/rapidprotoc --jobs "$(nproc)"

  # arm64 build + test on both pinned compilers. The packed-varint SWAR kernels are the reason: on
  # AArch64 they lower to native instructions the x86 gate never sees (ctz -> rbit+clz, popcount ->
  # cnt, and the big-endian load64 path -> rev), and a byte loop that vectorizes on x86 may not on
  # NEON. Format + tidy are architecture-independent, so they stay on the x86 jobs; `compilers` is
  # check.sh's name for the architecture-sensitive subset (build/test on gcc + clang, compile-fail,
  # fuzz-harness compile) -- the list lives THERE, shared with release.yml's arm64 leg.
  arm64:
    name: arm64 (build/test, gcc + clang)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Build + test on arm64 (./check.sh compilers)
        run: ./check.sh compilers

  # macOS build + test on AppleClang/libc++ -- the toolchain axis the Linux jobs can't cover
  # (different stdlib, different warning set, different Xcode-shipped clang). Added with the macOS
  # release binary (roadmap 3.2), REVERSING the 0.2-era "macOS CI deliberately out" cost/benefit
  # call: once releases ship a macOS binary, a platform nothing verifies would be a claimed
  # platform, and that flips the trade. Runs tests/system_build_test.sh -- the one home for the
  # system-compiler sequence, shared with release.yml's macos leg -- not check.sh, which needs
  # bash >= 4.4 (macOS ships 3.2) and pins compilers this image doesn't have.
  macos:
    name: macos (build/test, AppleClang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build + test with the system compiler (tests/system_build_test.sh)
        run: tests/system_build_test.sh

  tidy:
    # The shard count lives ONCE, in the matrix list: name and denominator derive from
    # strategy.job-total, so changing the fan-out is one edit (a stale hand-written /3 would
    # leave a slice unlinted while every shard reported success).
    name: tidy (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: clang-tidy shard
        run: >
          RAPIDPROTO_GATE_STAGES='tidy'
          RAPIDPROTO_TIDY_SHARD='${{ matrix.shard }}/${{ strategy.job-total }}'
          ./check.sh

  # The corpus legs of `./check.sh deep` self-skip here (exit 77 -- no fetch); they run in the
  # corpus job above, which is the one with the corpus. The deep summary names them as skipped,
  # which is the expected output of this job, not a gap. The golden-regen leg DOES run here --
  # this clean checkout is the only place the checked-in goldens are proven reproducible.
  deep:
    name: deep (ASan/UBSan + coverage + fuzz smoke + golden regen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Heavy tier (./check.sh deep)
        run: ./check.sh deep
      - name: Upload fuzz crash reproducers + logs
        if: failure()  # a CI-only fuzz crash is unreproducible without its input
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/
          if-no-files-found: ignore

  release:
    name: release (-O3 -Werror, gcc-13 + clang-20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Build + test Release on both compilers
        run: |
          set -euxo pipefail
          for cxx in g++-13 clang++-20; do
            dir="build/release-${cxx}"
            cmake -S . -B "$dir" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$cxx"
            cmake --build "$dir" -j"$(nproc)"
            "$dir/rapidproto_tests"
          done

  # The shipped surface: a tests-OFF build, `cmake --install`, and a consumer built purely from the
  # installed prefix via find_package -- so the Config file, the imported tool, and the installed
  # helper can't regress silently. Then the generated headers are compiled under C++20 and C++23:
  # header-only consumers meet newer standards first, on their compiler, not ours (system gcc here,
  # deliberately unpinned).
  consumer:
    name: consumer (install + find_package + C++20/23 headers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build + install rapidproto (tests OFF, system compiler)
        run: |
          set -euxo pipefail
          cmake -S . -B build/install -DCMAKE_BUILD_TYPE=Release -DRAPIDPROTO_BUILD_TESTS=OFF
          cmake --build build/install -j"$(nproc)"
          cmake --install build/install --prefix "$PWD/prefix"
      - name: Build the consumer example against the installed prefix (find_package)
        run: |
          set -euxo pipefail
          cmake -S examples/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build/consumer -j"$(nproc)"
          ctest --test-dir build/consumer --output-on-failure
      - name: Compile the generated headers under C++20 and C++23
        run: |
          set -euxo pipefail
          "$PWD/prefix/bin/rapidprotoc" --arena --stream -Iexamples/consumer/proto \
            --out-dir build/gen examples/consumer/proto/message.proto
          for std in c++20 c++23; do
            g++ -std="$std" -Wall -Wextra -Werror -Ibuild/gen -c examples/consumer/main.cpp -o /dev/null
          done
