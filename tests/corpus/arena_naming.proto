// Fixture for arenagen identifier dedup, reserved-name escaping, and oneof-reader naming: a
// synthesized type name that collides with a user name gains a `_` suffix, reserved names are
// escaped, and same-typed oneof members stay distinguishable -- so the golden must still be valid
// C++. Covers the <Map>Entry struct, the reserved decode() entry point, a field named like a oneof's
// reader, and same-typed oneof members routed by distinct tag types.
syntax = "proto3";

package an;

message Collide {
  message FooEntry {  // user type whose name equals the map `foo`'s synthesized entry type
    int32 a = 1;
  }

  optional int32 x = 1;        // explicit presence -> x() returns std::optional<int32> (no has_x())
  int32 has_x = 2;             // a field literally named has_x -> plain has_x() accessor, no collision
  map<string, int32> foo = 3;  // synthesizes a FooEntry struct -> collides with the nested FooEntry

  oneof pick {  // reader: pick(...)
    int32 p1 = 4;
    int32 p2 = 5;
  }
  int32 pick_case = 6;  // a field named pick_case -> pick_case(); coexists with the pick() reader

  oneof letters {  // same-typed members, distinct case-sensitive tags Letters::a / Letters::A
    int32 a = 7;
    int32 A = 8;
  }
  int32 decode = 9;     // reserved (the decode() entry point) -> `decode_`
}

// C++ forbids a member with the same name as its class, so every synthesized or nested name must
// also dedup against the ENCLOSING message's name -- not only against its siblings. protoc accepts
// all three shapes below, and each produced a header that failed to compile at the consumer.

message Callback {      // a oneof capitalizing to its own class's name -> tag struct `Callback_`
  oneof callback {
    string python_code = 1;
  }
  bool disabled = 2;
}

message FooEntry {                   // a map whose entry type would take the class's name
  map<string, int32> foo = 1;        // -> `FooEntry_`
}

message Outer {         // a nested message named like its parent -> the CHILD is deduped, `Outer_`
  message Outer {
    int32 v = 1;
  }
  Outer inner = 1;      // still resolves to the nested type, now spelled Outer_
}

// Private storage members are derived (`m_` + the member's id), so they need the same dedup: without
// it they can take the class's own name or a sibling's accessor. All protoc-valid.

message m_x {          // storage for `x` would be `m_x` == the class -> `m_x_`
  int32 x = 1;
}

message Sibling {
  int32 foo = 1;       // storage `m_foo` would collide with the accessor of the next field
  int32 m_foo = 2;
}

message config {       // the oneof READER method would take the class's name -> `config_`
  oneof config {
    string a = 1;
  }
}

message MaskOneof {    // a oneof named `mask` would derive `m_rp_mask` == the presence mask
  oneof mask {
    int32 a = 1;
  }
  optional int32 present = 2;
}

message Bytes {        // storage for `bytes` is `m_bytes`; the sibling accessor keeps its name now
  bytes bytes = 1;
  int32 m_bytes = 2;
}

// C++ keywords are legal proto field names. The generated header is compiled in the CONSUMER's
// translation unit, so every keyword must be escaped -- including the C++20 ones, since a consumer
// commonly builds at -std=c++20 even though this library targets 17. (The C++20 subset is compiled
// at that standard by check.sh's keyword smoke; the rest are covered by this golden compiling here.)
message Keywords {
  int32 static_cast = 1;
  int32 const_cast = 2;
  int32 dynamic_cast = 3;
  int32 reinterpret_cast = 4;
  int32 static_assert = 5;
  int32 concept = 6;
  int32 requires = 7;
  int32 consteval = 8;
  int32 constinit = 9;
  int32 co_await = 10;
  int32 co_return = 11;
  int32 co_yield = 12;
  int32 char8_t = 13;
  int32 concept_ = 14;  // dedups against the escaped `concept` -> concept__
}
