// A package named `rapidproto`, the runtime's own namespace. Under the roots it lands at
// `<prefix>::arena::rapidproto` -- three levels below `::rapidproto`, so it cannot merge into it,
// and the names below are free to be exactly the runtime's own types. That is what this fixture
// pins: the package needs no escape, and every reference from generated code still reaches the
// RUNTIME's type rather than the schema's same-named one. Before the roots the two were one
// namespace, and each name below redeclared a runtime type as a different kind of entity.
syntax = "proto3";
package rapidproto;

message wire {
  int32 x = 1;
}

message Arena {
  int32 y = 1;
}

message Tag {
  string s = 1;
}

message ByteView {
  bytes b = 1;
}

// Top-level enums: the shape that reaches the STREAMING model as well.
enum WireType {
  WIRE_TYPE_A = 0;
}

enum DecodeStatus {
  DECODE_STATUS_A = 0;
}
