// No `package` at all. The types still land under the roots (`rp::arena::Root`, never global
// scope), so this pins that the roots do not depend on a package being present -- the dumper
// internals open `rp::arena::rp_dump_detail` and qualify against it. The only corpus file without
// a package.
syntax = "proto3";

message Root {
  message Sub {
    int32 y = 1;
  }
  Sub sub = 1;
  Root self = 2;
}
