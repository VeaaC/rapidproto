// Regression corpus for identifier handling: distinct proto names that sanitize to the
// same C++ identifier must be de-duplicated per scope (never redefine a struct/enumerator), and
// type references must be fully `::`-rooted absolute names. All names below are protoc-valid.
syntax = "proto2";

package nm;

// Enumerator dedup: `decode` -> `decode_` (reserved), `decode_` then collides -> `decode__`.
enum E {
  decode = 0;
  decode_ = 1;
}

message M {
  // Nested type named after a C++ keyword -> `int_`. A sibling field `int_` (below) must not
  // collide with it; because nested types are indexed before field tags, the type keeps `int_`
  // and the field becomes `int__`.
  message int {
    optional int32 x = 1;
  }

  optional int32 decode = 1;     // reserved (the decode() entry point) -> `decode_`
  optional int32 decode_ = 2;    // collides -> `decode__`
  optional int int_field = 3;    // value type must reference ::nm::M::int_
  optional int32 int_ = 4;       // collides with nested type `int_` -> `int__`
  optional E e = 5;              // value type must reference ::nm::E

  oneof pick {
    int32 decode__ = 6;          // collides with the deduped field `decode_` -> `decode___`
  }
}

// A nested type may not take its ENCLOSING class's name: C++ forbids a member with the same name as
// its class, so the child is deduped and the parent keeps its name. protoc accepts this, and it is
// the shared naming table's job (both models emit these classes), not an arena-only concern.
// The enum inside the deduped class pins the MIRROR's id reuse: its common-header home must be
// `nm::Outer::Outer_` -- the model's escaped id, not a re-derivation from the raw proto name,
// which would open `namespace Outer` twice and collide with the class.
message Outer {
  message Outer {
    optional int32 v = 1;

    enum K {
      K0 = 0;
    }

    optional K k = 2;  // must resolve to ::nm::Outer::Outer_::K (aliasing the mirror)
  }
  optional Outer inner = 1;  // must resolve to ::nm::Outer::Outer_
}

// `linux` and `unix` are PREDEFINED macros under GNU extensions (`-std=gnu++17`, gcc's and clang's
// default when a consumer passes no -std) -- and lowercase, so ordinary names hit them. The test
// suite compiles with -std=c++17, where neither expands, so only the golden byte-compare pins the
// escape; that is why these live here rather than in a compile-only check.
message Gnu {
  message linux {
    optional int32 a = 1;
  }

  optional linux l = 1;   // value type must reference ::nm::Gnu::linux_
  optional int32 unix = 2;  // accessor/tag escaped to unix_
}

enum GnuEnum {
  GNU_ENUM_ZERO = 0;
  linux = 1;  // a bare lowercase value: escaped rather than macro-expanded
}

// <cstdint> is included by every generated header ITSELF, so its macro names break with no help
// from the consumer's include order: the limit macros expand anywhere, and the INT8_C()
// function-like family expands exactly where an accessor declaration puts the name -- before a
// `(`. Like Gnu above, the suite's -std=c++17 build cannot catch a missing escape by compiling;
// the golden byte-compare is the pin.
message Stdint {
  optional int32 INT32_MAX = 1;  // object-like limit macro -> INT32_MAX_
  optional int32 INT8_C = 2;     // function-like: the accessor `INT8_C()` would expand -> INT8_C_
}

enum StdintEnum {
  STDINT_ENUM_UNSET = 0;
  STDINT_ENUM_SIZE_MAX = 1;  // stripping would expose bare SIZE_MAX: the whole enum stays unstripped
}

// An UNCONTESTED top-level escape: nothing else in this package wants `unix_`, so the escape must
// take exactly `sanitize(raw)` -- one trailing `_`, the same as a nested name or a field. Every
// other escaped top-level name in the fixtures is contested (escdedup, pkgorder), so without this
// one a naming pass that over-escalated free escapes (`unix__`) left every golden unchanged.
message unix {
  optional int32 a = 1;
}

// The streaming struct holds its bytes in an `rp_`-prefixed private member, which sanitize() puts
// out of reach of any proto name -- so `m_bytes` is an ordinary identifier here, in all three roles.
message m_bytes {
  optional int32 v = 1;
}

message UsesMBytes {
  optional int32 m_bytes = 1;
  optional string other = 2;
}

// Out-of-line definitions must name themselves ABSOLUTELY. Naming one enters its class scope for the
// rest of the declarator, so a relative qualifier has its own parameter type resolved from inside the
// class -- where a nested name shadows the enclosing one and the header stops compiling. Two shapes
// reach that, both protoc-valid:

// A nested ENUM whose name is the enclosing top-level message's.
message Shadow {
  message Inner {
    enum Shadow {
      SHADOW_X = 0;
    }
    optional Shadow e = 1;  // resolves to Inner's enum, not the outer message
  }
  optional Inner inner = 1;
}

// Three levels of the same name. Two levels are handled by per-scope dedup alone; the third is what
// needs the absolute qualifier.
message Deep {
  message Deep {
    message Deep {
      optional int32 x = 1;
    }
    optional Deep inner = 1;
  }
  optional Deep mid = 1;
}

// `std` is the one namespace the generated code names UNROOTED (`std::int32_t`, `std::string_view`,
// `std::optional`), so it is reserved: a proto `std` that becomes a C++ TYPE shadows the namespace
// from inside the class and the header stops compiling. protoc accepts every spelling below, and
// each role gets its own message because protoc forbids a field and a nested type of the same name
// in one. A PACKAGE named `std` is covered separately, by nsedge/stdpkg.proto.
message Std {
  message std {
    optional int32 a = 1;
  }

  optional std s = 1;  // value type must reference ::nm::Std::std_
}

message StdEnum {
  enum std {
    STD_X = 0;
  }

  optional std e = 1;  // must reference ::nm::StdEnum::std_
}

// Fields break the STREAMING model only, where each becomes a nested tag struct. The arena accessor
// of the same name is a member function, which a nested-name-specifier skips -- it is escaped for
// uniformity, not because it shadowed anything.
message StdField {
  optional int32 std = 1;
}

message StdMap {
  map<string, int32> std = 1;
}

// `RP_`-prefixed names are escaped like the lowercase `rp_` ones: the runtime headers define
// RP_FLATTEN and RP_NOINLINE as object-like macros, so an accessor or a bare enum value spelled that
// way macro-expands instead of compiling. One prefix rule covers whatever macros exist.
message Macros {
  message RP_FLATTEN {
    optional int32 a = 1;
  }

  optional RP_FLATTEN m = 1;   // value type must reference ::nm::Macros::RP_FLATTEN_
  optional int32 RP_NOINLINE = 2;

  // `rP_` matches neither `rp_` nor `RP_`, so sanitize leaves it -- but arenagen capitalizes the id
  // to build the map entry type, MANUFACTURING `RP_xEntry` inside the reserved prefix. Synthesized
  // names re-check for that.
  map<string, int32> rP_x = 3;
}

enum MacroEnum {
  RP_FLATTEN = 0;  // an unprefixed enum value: escaped rather than macro-expanded
  MACRO_ENUM_OTHER = 1;
}

// arenagen SYNTHESIZES a oneof's visit-tag struct from the raw proto name, so codegen::sanitize
// never sees it -- but `struct EOF` still macro-expands. Only the macro-expanding subset is escaped
// here: `Value` is a legal tag struct, and escaping it would rename working public API.
message OneofTags {
  oneof EOF {
    int32 a = 1;
  }

  oneof value {  // stays `Value`
    int32 b = 2;
  }

  oneof RP_FLATTEN {
    int32 c = 3;
  }
}

// A FIELD named `stream` keeps its name: the streaming model's `namespace nm::stream` is a
// different scope from anything inside the class. (A top-level TYPE named `stream` does clash with
// it, and is not fixed here -- see the roadmap; escaping it needs a package-wide dedup scope.)
message UsesStream {
  optional int32 stream = 1;
}

// Names the emitters used to reserve, freed by giving their own identifiers the `rp_` prefix
// instead. Each of these is a template parameter or alias in generated code -- `rp_Callbacks` and
// `rp_Fs` are the callback packs, `rp_T` the decode_into friend's parameter, `rp_Tag` the dumper's
// oneof alias -- so a proto name of the old spelling is now just an ordinary identifier.
message Freed {
  optional int32 Callbacks = 1;
  optional int32 RpFs = 2;
  optional int32 RpT = 3;
  optional int32 RpTag = 4;

  oneof RpFs_oneof {  // the arena visitor's pack shares this class scope
    int32 x = 5;
  }
}

// The one spelling of the four that actually failed to compile before the pack took the prefix: the
// arena oneof reader is named after the oneof, so `template <class... RpFs> void RpFs(RpFs&&...)`
// declared a function shadowing its own template parameter. A FIELD named `RpFs` was always fine.
message FreedOneof {
  oneof RpFs {
    int32 a = 1;
  }
}
