# Rust decode benchmarking, all in one bench-only crate (`publish = false`): the generated arena
# decoder (baseline) measured both against itself (the criterion A/B bench) and against other Rust
# protobuf crates (the ecosystem comparison), over the shared bench.proto payloads and one shared
# per-field checksum walk. Competitor crates and their codegen are deps HERE only, so they never
# reach the `rapidproto` runtime, the generated code, or the no_std tiers. Competitors are added one
# at a time and selected at runtime (the `bench` binary's ARMS filter): prost, then rust-protobuf.
[package]
name = "rapidproto-bench"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# Baseline: our runtime + the generated `bench` decoders (reused from the golden crate, so the
# comparison runs the exact code a consumer compiles).
rapidproto = { path = "../rapidproto" }
rustgen-golden = { path = "../rustgen-golden" }
# Competitor: prost (materializes into owned Vec/String; the checksum walk reads every field so the
# owned allocation is paid for, not elided).
prost = "0.13"
# Competitor: rust-protobuf, the 2nd most-used Rust protobuf crate. Also an owned model
# (`parse_from_bytes` -> owned structs, UTF-8-validated); same read-every-field treatment.
protobuf = "3"
# Competitor: quick-protobuf, the first NON-owned competitor. Generated types borrow strings/bytes
# (`Cow<'a, _>`) from the input and nest sub-messages inline, but repeated fields still materialize to
# heap `Vec`s -- "borrowed-string, allocating-tree," decoded via `from_reader`.
quick-protobuf = "0.8"
# Competitor: femtopb, the no-alloc borrowed peer. `#![no_std]`, borrows `&'a str`, and decodes
# repeated fields LAZILY (no `Vec`) -- the every-field checksum walk forces that work so it is not
# flattered. The nearest ecosystem analog to our arena-of-borrowed-views allocation profile.
femtopb = "0.9"

[build-dependencies]
# Pure-Rust protobuf compiler (no `protoc` / C toolchain): compiles bench.proto to a descriptor set
# that prost-build turns into Rust -- keeps this crate cargo-only like the rest of the workspace.
protox = "0.7"
prost-build = "0.13"
# rust-protobuf's codegen, driven with its pure-Rust parser (`.pure()`, no `protoc`) to match the
# no-toolchain story above.
protobuf-codegen = "3"
# quick-protobuf's codegen (also pure Rust, no `protoc`): renders bench.proto to its borrowed-view
# decoders.
pb-rs = "0.10"
# femtopb's codegen (pure Rust, no `protoc`): renders bench.proto to its lazy/borrowed decoders.
femtopb-build = "0.9"

[dev-dependencies]
# Drives the Rust-vs-Rust A/B bench (benches/decode.rs); default features off -- it wants timings, not
# the HTML/plotting stack. Matches the rapidproto wire bench.
criterion = { version = "0.3", default-features = false }

# The ecosystem runner: decode each scenario with every (runtime-selected) arm over shared payloads.
[[bin]]
name = "bench"
path = "src/main.rs"

# The Rust-vs-Rust A/B bench for the generated `bench` decoder across the 8 arena scenarios, over the
# shared protoc-canonical payloads. Run it PINNED and ALIGNED (see the bench header for the directory):
#   RUSTFLAGS="-Cllvm-args=-align-all-functions=6" taskset -c 0 cargo bench -p rapidproto-bench --bench decode
[[bench]]
name = "decode"
harness = false
