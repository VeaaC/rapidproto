[package]
name = "rustgen-golden"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Compile check for the Rust generator's output: `src/lib.rs` includes each committed golden under
# `goldens/`, so CI proves the emitted `common`+`arena` modules (and their cross-module paths) are
# valid, compilable Rust. Goldens are generated code, so they are not linted here. Regenerated by
# the standard golden flow (tests/regen_goldens.sh), like every other golden.

# Forward the feature tiers to rapidproto with no defaults of our own, so a workspace
# `--no-default-features` build genuinely exercises the no_std path (feature unification would
# otherwise force rapidproto/std on via this edge) — and proves the generated code is no_std-clean.
[features]
default = ["std"]
std = ["rapidproto/std"]
alloc = ["rapidproto/alloc"]

[dependencies]
rapidproto = { path = "../rapidproto", default-features = false }

# The decode round-trip test (tests/decode.rs) decodes into a heap `Arena`, so it needs an
# allocator; a dev-dependency with default features (std) provides it for test builds only -- the
# plain `cargo build --no-default-features` compile-check still exercises the no_std path via the
# normal dependency above.
[dev-dependencies]
rapidproto = { path = "../rapidproto" }
