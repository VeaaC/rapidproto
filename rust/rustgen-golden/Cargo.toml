[package]
name = "rustgen-golden"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Compile check for the Rust generator's output: `src/lib.rs` includes each committed golden under
# `goldens/` with no lint allows of its own, so CI proves the emitted modules and their cross-module
# paths are valid Rust and that a plain include adds no warnings. Regenerated by the standard golden
# flow (tests/regen_goldens.sh), like every other golden.

# Forward the feature to rapidproto with no defaults of our own, so a workspace
# `--no-default-features` build genuinely exercises the no-alloc path (feature unification would
# otherwise force rapidproto/alloc on via this edge) — and proves the generated code builds there.
[features]
default = ["alloc"]
alloc = ["rapidproto/alloc"]

# `serde` because every golden has the generated Serialize impls. It does not turn on `alloc`, so
# the no-alloc build proves the impls build there too.
[dependencies]
rapidproto = { path = "../rapidproto", default-features = false, features = ["serde"] }

# The decode round-trip test (tests/decode.rs) decodes into a heap `Arena`, so it needs an
# allocator; a dev-dependency with default features (alloc) provides it for test builds only -- the
# plain `cargo build --no-default-features` compile-check still exercises the no-alloc path via the
# normal dependency above. A command that builds tests here turns `rapidproto/alloc` on for
# everything it builds, so CI tests the runtime's no-alloc tier with `-p rapidproto` alone.
[dev-dependencies]
rapidproto = { path = "../rapidproto" }
# Dev-only: the serde Serializer that renders a decoded message as the differential dump JSON. Used by
# tests/serialize.rs to exercise the generated Serialize impls.
rapidproto-diff = { path = "../rapidproto-diff" }

# Benchmarks live in the `rapidproto-bench` crate (it depends on this one for the generated decoders),
# not here -- this crate stays golden compile-check + integration tests, which is all the no_std/Miri
# CI tiers need to exercise.
