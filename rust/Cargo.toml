# RapidProto Rust support — in-tree Cargo workspace (work in progress, on the `rust` branch).
# The scratch spikes rust-poc/ and rust-m0/ at the repo root are NOT part of this workspace and
# stay untracked.
[workspace]
resolver = "2"
members = ["rapidproto", "rapidproto-build", "rapidproto-diff", "rustgen-golden", "examples/consumer", "examples/osm-pbf", "rapidproto-bench"]
# The google-upb capstone arm lives in its own crate (it needs Google's `protobuf` v4, incompatible
# with the v3 the rust-protobuf arm uses) and is EXCLUDED here so no workspace-wide command builds it:
# it requires an exact-version `protoc` (36.2) + a C toolchain, and is compiled only when
# `rapidproto-bench --features google-upb` opts in. See rapidproto-bench-upb/Cargo.toml.
exclude = ["rapidproto-bench-upb"]

# rapidproto-build's tests run the wasm generator in wasmi, which unoptimized takes minutes for the
# goldens: optimize the interpreter in this workspace's debug builds. Profiles apply only to the
# workspace that is built, so builds that depend on rapidproto-build are unaffected.
[profile.dev.package.wasmi]
opt-level = 1
[profile.dev.package.wasmi_core]
opt-level = 1
[profile.dev.package.wasmi_ir]
opt-level = 1
