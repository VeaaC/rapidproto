# A minimal consumer of the generated Rust decoders: build.rs generates them from proto/, main.rs
# decodes a message. Built with cargo alone.
[package]
name = "consumer-example"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# The generated decoders carry serde `Serialize` impls behind a `serde` feature. A consumer that
# includes generated code declares this feature (even when leaving it off) so the generated
# `#[cfg(feature = "serde")]` is a known cfg; enable it to serialize decoded messages (main.rs then
# also prints the decoded message as JSON via serde_json).
[features]
serde = ["rapidproto/serde", "dep:serde_json"]

[dependencies]
rapidproto = { path = "../../rapidproto" }
serde_json = { version = "1", optional = true }

[build-dependencies]
rapidproto-build = { path = "../../rapidproto-build" }
