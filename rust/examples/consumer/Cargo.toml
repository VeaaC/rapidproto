# A minimal consumer of the generated Rust decoders: build.rs generates them from proto/, main.rs
# decodes a message.
[package]
name = "consumer-example"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Generated code checks these features on the crate that includes it, so a crate declares the ones it
# wants.
[features]
# `Serialize` impls for decoded messages. main.rs then also prints the message as JSON.
serde = ["rapidproto/serde", "dep:serde_json"]
# The owning-handle API, `decode_owned`.
alloc = ["rapidproto/alloc"]

[dependencies]
rapidproto = { path = "../../rapidproto" }
serde_json = { version = "1", optional = true }

[build-dependencies]
rapidproto-build = { path = "../../rapidproto-build" }
