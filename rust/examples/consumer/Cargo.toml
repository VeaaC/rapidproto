# A minimal consumer of the generated Rust decoders: build.rs generates them from proto/, main.rs
# decodes a message.
[package]
name = "consumer-example"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# Asks the generator for `Serialize` impls (see build.rs), which need `rapidproto/serde`. main.rs then
# also prints the message as JSON.
serde = ["rapidproto/serde", "dep:serde_json"]

[dependencies]
rapidproto = { path = "../../rapidproto" }
serde_json = { version = "1", optional = true }

[build-dependencies]
rapidproto-build = { path = "../../rapidproto-build" }
