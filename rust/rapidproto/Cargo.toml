[package]
name = "rapidproto"
version = "0.1.0-alpha.2"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Runtime for the Protobuf decoders that rapidproto-build generates."
repository = "https://github.com/VeaaC/rapidproto"
readme = "README.md"
keywords = ["protobuf", "protocol-buffers", "decode", "zero-copy", "no-std"]
categories = ["encoding", "parser-implementations", "no-std", "no-std::no-alloc"]

[features]
default = ["alloc"]
# Lets the arena grow on the heap and adds `Arena::new`, `decode_owned` and `Owned`.
alloc = []
# `Serialize` for the runtime's types, and the `serde` re-export that code generated with
# `Config::serde` names.
serde = ["dep:serde"]

[dependencies]
# The only dependency, and optional. no_std without its default features; no `derive`, because
# every impl is written out.
serde = { version = "1", default-features = false, optional = true }

# criterion runs the wire benchmark, benches/wire.rs. `html_reports` changes nothing in 0.3 but
# silences its warning that HTML reports will become optional.
[dev-dependencies]
criterion = { version = "0.3", features = ["html_reports"] }

# Shows the `serde` items too.
[package.metadata.docs.rs]
features = ["serde"]
targets = ["x86_64-unknown-linux-gnu"]

# rust/README.md shows how to run it.
[[bench]]
name = "wire"
harness = false
