[package]
name = "rapidproto-build"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Generate Rust protobuf decoders from .proto files with cargo alone (RapidProto; work in progress)."
repository = "https://github.com/VeaaC/rapidproto"
readme = "README.md"
keywords = ["protobuf", "protocol-buffers", "codegen", "build-dependencies", "wasm"]
categories = ["development-tools::build-utils", "encoding"]
# The integration tests are workspace-only dogfood gates (they regenerate the sibling
# `rustgen-golden` goldens and drive the `examples/consumer` schema), so they cannot run from a
# published tarball -- keep them out of the package rather than ship tests that can't build.
exclude = ["tests"]
publish = false

# The generator ships as a prebuilt WebAssembly module run through the wasmi interpreter (pure Rust),
# so consumers build with cargo alone. It uses only the minimal WASI surface (stdin/stdout), so
# wasmi_wasi's preview-1 shim is all that is needed.
[dependencies]
# The blob is loaded as binary and validated; we never parse the WebAssembly text format, so drop
# wasmi's default `wat` feature (and its text-parser subtree: wat/wast/wasm-encoder/bumpalo/...). The
# rest of wasmi's defaults are kept as-is.
wasmi = { version = "2.0.0", default-features = false, features = [
    "stable",
    "std",
    "validate",
    "memory64",
    "auto-dispatch",
] }
wasmi_wasi = "2.0.0"

[[bin]]
name = "rapidproto-rust"
path = "src/main.rs"
